<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ระบบบันทึกและอัปเดตวันลาทีม</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Prompt', sans-serif; background-color: #f8fafc; }
  </style>
</head>
<body class="text-slate-800 pb-12">

  <!-- Header -->
  <header class="bg-white border-b border-slate-200 sticky top-0 z-10 shadow-sm">
    <div class="max-w-3xl mx-auto px-4 py-4 flex justify-between items-center">
      <div>
        <h1 class="text-xl font-bold text-slate-900">📅 อัปเดตวันลาทีม</h1>
        <p class="text-xs text-slate-500">บันทึกและดูรายการลาของทุกคนแบบเรียลไทม์</p>
      </div>
      <button onclick="copySummary()" class="bg-emerald-600 hover:bg-emerald-700 text-white text-sm font-medium px-3.5 py-2 rounded-xl shadow-sm transition active:scale-95">
        📋 คัดลอกส่งแชท
      </button>
    </div>
  </header>

  <main class="max-w-3xl mx-auto px-4 mt-6 space-y-6">

    <!-- ฟอร์มบันทึกวันลา -->
    <section class="bg-white p-5 rounded-2xl shadow-sm border border-slate-200">
      <h2 class="text-base font-semibold mb-4 text-slate-800">➕ แจ้งวันลาใหม่</h2>
      <form id="leaveForm" class="space-y-4">
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <div>
            <label class="block text-sm font-medium text-slate-700 mb-1">ชื่อ-ชื่อเล่น ผู้ลา *</label>
            <input type="text" id="empName" required placeholder="เช่น ลูกน้ำ, บอล, พี่ต้น"
              class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none text-sm">
          </div>
          <div>
            <label class="block text-sm font-medium text-slate-700 mb-1">วันที่ลา *</label>
            <input type="date" id="leaveDate" required
              class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none text-sm">
            <p id="thaiDatePreview" class="text-xs text-blue-600 font-medium mt-1"></p>
          </div>
        </div>

        <!-- ประเภทการลา -->
        <div>
          <label class="block text-sm font-medium text-slate-700 mb-2">ประเภทการลา *</label>
          <div class="grid grid-cols-2 sm:grid-cols-4 gap-2.5">
            <label class="cursor-pointer">
              <input type="radio" name="leaveType" value="ลากิจ" class="peer sr-only" checked>
              <div class="text-center py-2.5 px-3 rounded-xl border border-slate-200 text-sm font-medium peer-checked:bg-amber-500 peer-checked:text-white peer-checked:border-amber-500 transition">
                💼 ลากิจ
              </div>
            </label>
            <label class="cursor-pointer">
              <input type="radio" name="leaveType" value="ลาพักร้อน" class="peer sr-only">
              <div class="text-center py-2.5 px-3 rounded-xl border border-slate-200 text-sm font-medium peer-checked:bg-sky-500 peer-checked:text-white peer-checked:border-sky-500 transition">
                🏖️ ลาพักร้อน
              </div>
            </label>
            <label class="cursor-pointer">
              <input type="radio" name="leaveType" value="ลาป่วย" class="peer sr-only">
              <div class="text-center py-2.5 px-3 rounded-xl border border-slate-200 text-sm font-medium peer-checked:bg-rose-500 peer-checked:text-white peer-checked:border-rose-500 transition">
                🤒 ลาป่วย
              </div>
            </label>
            <label class="cursor-pointer">
              <input type="radio" name="leaveType" value="ลาวันเกิด" class="peer sr-only">
              <div class="text-center py-2.5 px-3 rounded-xl border border-slate-200 text-sm font-medium peer-checked:bg-purple-500 peer-checked:text-white peer-checked:border-purple-500 transition">
                🎂 ลาวันเกิด
              </div>
            </label>
          </div>
        </div>

        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1">เหตุผลที่ลา *</label>
          <input type="text" id="reason" required placeholder="ระบุเหตุผลสั้นๆ เช่น ธุระส่วนตัว, หาหมอ, พักผ่อน"
            class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none text-sm">
        </div>

        <button type="submit" id="submitBtn"
          class="w-full bg-slate-900 hover:bg-slate-800 text-white font-medium py-3 rounded-xl shadow-sm transition active:scale-[0.99]">
          บันทึกวันลา
        </button>
      </form>
    </section>

    <!-- ตัวกรองและรายการแสดงผล -->
    <section class="space-y-3">
      <div class="flex flex-wrap items-center justify-between gap-2">
        <h2 class="text-base font-semibold text-slate-800">📋 รายการอัปเดตของทุกคน</h2>
        <select id="filterType" onchange="renderLeaves()" class="text-sm bg-white border border-slate-300 rounded-xl px-3 py-1.5 outline-none">
          <option value="ALL">แสดงทุกประเภทการลา</option>
          <option value="ลากิจ">ลากิจ</option>
          <option value="ลาพักร้อน">ลาพักร้อน</option>
          <option value="ลาป่วย">ลาป่วย</option>
          <option value="ลาวันเกิด">ลาวันเกิด</option>
        </select>
      </div>

      <div id="leaveList" class="space-y-3">
        <p class="text-center text-sm text-slate-400 py-8">กำลังโหลดข้อมูล...</p>
      </div>
    </section>

  </main>

  <script>
    const FIREBASE_URL = "https://summary-leave-default-rtdb.asia-southeast1.firebasedatabase.app/leaves.json";

    let allLeaves = [];

    function formatThaiDate(dateStr) {
      if (!dateStr) return "";
      const [y, m, d] = dateStr.split('-').map(Number);
      const dateObj = new Date(y, m - 1, d);
      const days = ['อาทิตย์', 'จันทร์', 'อังคาร', 'พุธ', 'พฤหัสบดี', 'ศุกร์', 'เสาร์'];
      const months = [
        'มกราคม', 'กุมภาพันธ์', 'มีนาคม', 'เมษายน', 'พฤษภาคม', 'มิถุนายน',
        'กรกฎาคม', 'สิงหาคม', 'กันยายน', 'ตุลาคม', 'พฤศจิกายน', 'ธันวาคม'
      ];
      return `วัน${days[dateObj.getDay()]}ที่ ${d} ${months[m - 1]} พ.ศ. ${y + 543}`;
    }

    const dateInput = document.getElementById('leaveDate');
    const previewEl = document.getElementById('thaiDatePreview');
    dateInput.valueAsDate = new Date();
    previewEl.textContent = formatThaiDate(dateInput.value);

    dateInput.addEventListener('change', (e) => {
      previewEl.textContent = formatThaiDate(e.target.value);
    });

    function getBadgeStyle(type) {
      const styles = {
        'ลากิจ': 'bg-amber-100 text-amber-800 border-amber-200',
        'ลาพักร้อน': 'bg-sky-100 text-sky-800 border-sky-200',
        'ลาป่วย': 'bg-rose-100 text-rose-800 border-rose-200',
        'ลาวันเกิด': 'bg-purple-100 text-purple-800 border-purple-200'
      };
      return styles[type] || 'bg-slate-100 text-slate-800';
    }

    async function fetchLeaves() {
      try {
        const res = await fetch(FIREBASE_URL);
        const data = await res.json();
        allLeaves = data
          ? Object.entries(data).map(([id, val]) => ({ id, ...val }))
          : [];
        allLeaves.sort((a, b) => b.date.localeCompare(a.date));
        renderLeaves();
      } catch (err) {
        document.getElementById('leaveList').innerHTML =
          `<p class="text-center text-sm text-rose-500 py-6">ไม่สามารถเชื่อมต่อฐานข้อมูลได้</p>`;
      }
    }

    function renderLeaves() {
      const filter = document.getElementById('filterType').value;
      const listEl = document.getElementById('leaveList');
      const filtered = filter === 'ALL' ? allLeaves : allLeaves.filter(item => item.type === filter);

      if (filtered
