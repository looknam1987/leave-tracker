<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ระบบบันทึกและอัปเดตวันลาทีม</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Prompt', sans-serif; background-color: #f8fafc; }
  </style>
</head>
<body class="text-slate-800 pb-12">

  <!-- Header -->
  <header class="bg-white border-b border-slate-200 sticky top-0 z-10 shadow-sm">
    <div class="max-w-4xl mx-auto px-4 py-4 flex flex-wrap justify-between items-center gap-3">
      <div class="flex items-center gap-3">
        <div class="w-11 h-11 bg-rose-600 text-white font-bold rounded-2xl flex items-center justify-center text-lg shadow-md shadow-rose-200 tracking-tighter">
          ลา
        </div>
        <div>
          <h1 class="text-xl font-bold text-slate-900">ระบบบันทึกและอัปเดตวันลาทีม</h1>
          <p id="syncStatus" class="text-xs text-slate-500">กำลังเชื่อมต่อข้อมูล...</p>
        </div>
      </div>
      <div class="flex items-center gap-2">
        <button type="button" onclick="exportToExcel()" class="bg-blue-600 hover:bg-blue-700 text-white text-sm font-medium px-3.5 py-2 rounded-xl shadow-sm transition active:scale-95">
          📥 โหลดไฟล์ Excel
        </button>
        <button type="button" onclick="copySummary()" class="bg-emerald-600 hover:bg-emerald-700 text-white text-sm font-medium px-3.5 py-2 rounded-xl shadow-sm transition active:scale-95">
          📋 คัดลอกส่งแชท
        </button>
      </div>
    </div>
  </header>

  <main class="max-w-4xl mx-auto px-4 mt-6 space-y-6">

    <!-- สรุปโควตาการลาแบบกระชับ 1 แถวต่อ 1 คน -->
    <section class="bg-white p-5 rounded-2xl shadow-sm border border-slate-200 space-y-3">
      <div class="flex flex-wrap items-center justify-between gap-2">
        <h2 class="text-base font-semibold text-slate-800">📊 สรุปโควตาวันลาคงเหลือของทีม</h2>
        <div class="flex flex-wrap gap-2 text-[11px] font-medium">
          <span class="px-2 py-0.5 rounded bg-amber-100 text-amber-800">💼 ลากิจ (6)</span>
          <span class="px-2 py-0.5 rounded bg-sky-100 text-sky-800">🏖️ พักร้อน (6)</span>
          <span class="px-2 py-0.5 rounded bg-rose-100 text-rose-800">🤒 ลาป่วย (30)</span>
          <span class="px-2 py-0.5 rounded bg-purple-100 text-purple-800">🎂 วันเกิด (1)</span>
        </div>
      </div>
      <div id="quotaMatrix" class="divide-y divide-slate-100 border border-slate-100 rounded-xl overflow-hidden"></div>
    </section>

    <!-- ฟอร์มบันทึก/แก้ไขวันลา -->
    <section class="bg-white p-5 rounded-2xl shadow-sm border border-slate-200">
      <div class="flex justify-between items-center mb-4">
        <h2 id="formTitle" class="text-base font-semibold text-slate-800">➕ แจ้งวันลาใหม่</h2>
        <button id="cancelEditBtn" type="button" onclick="resetForm()" class="hidden text-xs text-rose-600 bg-rose-50 px-2.5 py-1 rounded-lg hover:bg-rose-100 transition">
          ✕ ยกเลิกการแก้ไข
        </button>
      </div>

      <form id="leaveForm" class="space-y-4">
        <input type="hidden" id="editId" value="">

        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1">ชื่อ-ชื่อเล่น ผู้ลา *</label>
          <select id="empName" required class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 focus:ring-2 focus:ring-blue-500 outline-none text-sm bg-white">
            <option value="" disabled selected>-- กรุณาเลือกชื่อ --</option>
            <option value="กุสุมา ไชยโชติ (พัท)">กุสุมา ไชยโชติ (พัท)</option>
            <option value="ภัทราภรณ์ หุ่นดี (รุ้ง)">ภัทราภรณ์ หุ่นดี (รุ้ง)</option>
            <option value="ประไพพร กรุตรนิยม (ปู)">ประไพพร กรุตรนิยม (ปู)</option>
            <option value="อรนภา ตุ่มอ่อน (ลูกน้ำ)">อรนภา ตุ่มอ่อน (ลูกน้ำ)</option>
            <option value="จิราพร พิมพ์โคตร (จิ)">จิราพร พิมพ์โคตร (จิ)</option>
            <option value="วิริยา เหล่าเขตกิจ (ใหม่)">วิริยา เหล่าเขตกิจ (ใหม่)</option>
            <option value="เฌอลินญ์ ยศธรเตโชพัฒน์ (เฌอ)">เฌอลินญ์ ยศธรเตโชพัฒน์ (เฌอ)</option>
            <option value="วรกาญจน์ พรมนอก (โอ๋)">วรกาญจน์ พรมนอก (โอ๋)</option>
            <option value="เฉลิมพล คงปรีชา (ตั๊ก)">เฉลิมพล คงปรีชา (ตั๊ก)</option>
          </select>
        </div>

        <!-- ประเภทการลา (อยู่เหนือวันที่) -->
        <div>
          <label class="block text-sm font-medium text-slate-700 mb-2">ประเภทการลา *</label>
          <div class="grid grid-cols-2 sm:grid-cols-4 gap-2.5">
            <label class="cursor-pointer">
              <input type="radio" name="leaveType" value="ลากิจ" class="peer sr-only" checked onchange="toggleTimeBox()">
              <div class="text-center py-2.5 px-3 rounded-xl border border-slate-200 text-sm font-medium peer-checked:bg-amber-500 peer-checked:text-white peer-checked:border-amber-500 transition">
                💼 ลากิจ
              </div>
            </label>
            <label class="cursor-pointer">
              <input type="radio" name="leaveType" value="ลาพักร้อน" class="peer sr-only" onchange="toggleTimeBox()">
              <div class="text-center py-2.5 px-3 rounded-xl border border-slate-200 text-sm font-medium peer-checked:bg-sky-500 peer-checked:text-white peer-checked:border-sky-500 transition">
                🏖️ ลาพักร้อน
              </div>
            </label>
            <label class="cursor-pointer">
              <input type="radio" name="leaveType" value="ลาป่วย" class="peer sr-only" onchange="toggleTimeBox()">
              <div class="text-center py-2.5 px-3 rounded-xl border border-slate-200 text-sm font-medium peer-checked:bg-rose-500 peer-checked:text-white peer-checked:border-rose-500 transition">
                🤒 ลาป่วย
              </div>
            </label>
            <label class="cursor-pointer">
              <input type="radio" name="leaveType" value="ลาวันเกิด" class="peer sr-only" onchange="toggleTimeBox()">
              <div class="text-center py-2.5 px-3 rounded-xl border border-slate-200 text-sm font-medium peer-checked:bg-purple-500 peer-checked:text-white peer-checked:border-purple-500 transition">
                🎂 ลาวันเกิด
              </div>
            </label>
          </div>
        </div>

        <!-- เลือกช่วงวันที่ลา -->
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <div>
            <label class="block text-sm font-medium text-slate-700 mb-1">ตั้งแต่วันที่ *</label>
            <input type="date" id="startDate" required class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 focus:ring-2 focus:ring-blue-500 outline-none text-sm">
          </div>
          <div>
            <label class="block text-sm font-medium text-slate-700 mb-1">ถึงวันที่ (กรณีลาวันเดียว ให้เลือกวันเดิม) *</label>
            <input type="date" id="endDate" required class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 focus:ring-2 focus:ring-blue-500 outline-none text-sm">
          </div>
        </div>

        <!-- ช่วงเวลาลากิจ (09.00 - 18.00 / นาที 00 และ 30) -->
        <div id="businessTimeBox" class="bg-amber-50/80 border border-amber-200 rounded-xl p-3.5 space-y-2.5">
          <div class="flex flex-wrap items-center justify-between gap-2">
            <label class="text-sm font-medium text-amber-950">⏰ ช่วงเวลาลากิจ (09.00 - 18.00) *</label>
            <div class="flex flex-wrap gap-1.5">
              <button type="button" onclick="setTime('09','00','18','00')" class="text-[11px] bg-white hover:bg-amber-100 text-amber-900 border border-amber-300 px-2 py-0.5 rounded-md">ทั้งวัน (09.00-18.00)</button>
              <button type="button" onclick="setTime('09','00','12','00')" class="text-[11px] bg-white hover:bg-amber-100 text-amber-900 border border-amber-300 px-2 py-0.5 rounded-md">ครึ่งเช้า (09.00-12.00)</button>
              <button type="button" onclick="setTime('13','00','18','00')" class="text-[11px] bg-white hover:bg-amber-100 text-amber-900 border border-amber-300 px-2 py-0.5 rounded-md">ครึ่งบ่าย (13.00-18.00)</button>
            </div>
          </div>

          <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
            <div class="bg-white p-2.5 rounded-lg border border-amber-200 flex items-center justify-between gap-2">
              <span class="text-xs text-amber-900 font-medium">ตั้งแต่</span>
              <div class="flex items-center gap-1.5">
                <select id="startHour" class="px-2 py-1 rounded border border-amber-300 bg-white text-sm font-medium">
                  <option value="09">09</option>
                  <option value="10">10</option>
                  <option value="11">11</option>
                  <option value="12">12</option>
                  <option value="13">13</option>
                  <option value="14">14</option>
                  <option value="15">15</option>
                  <option value="16">16</option>
                  <option value="17">17</option>
                  <option value="18">18</option>
                </select>
                <span class="font-bold text-amber-900">.</span>
                <select id="startMin" class="px-2 py-1 rounded border border-amber-300 bg-white text-sm font-medium">
                  <option value="00">00</option>
                  <option value="30">30</option>
                </select>
              </div>
            </div>

            <div class="bg-white p-2.5 rounded-lg border border-amber-200 flex items-center justify-between gap-2">
              <span class="text-xs text-amber-900 font-medium">ถึง</span>
              <div class="flex items-center gap-1.5">
                <select id="endHour" class="px-2 py-1 rounded border border-amber-300 bg-white text-sm font-medium">
                  <option value="09">09</option>
                  <option value="10">10</option>
                  <option value="11">11</option>
                  <option value="12">12</option>
                  <option value="13">13</option>
                  <option value="14">14</option>
                  <option value="15">15</option>
                  <option value="16">16</option>
                  <option value="17">17</option>
                  <option value="18" selected>18</option>
                </select>
                <span class="font-bold text-amber-900">.</span>
                <select id="endMin" class="px-2 py-1 rounded border border-amber-300 bg-white text-sm font-medium">
                  <option value="00">00</option>
                  <option value="30">30</option>
                </select>
              </div>
            </div>
          </div>
          <p id="timeErrorMsg" class="hidden text-xs text-rose-600 font-medium"></p>
        </div>

        <!-- สถานะการลา -->
        <div>
          <label class="block text-sm font-medium text-slate-700 mb-2">สถานะการลา *</label>
          <div class="grid grid-cols-2 gap-2.5">
            <label class="cursor-pointer">
              <input type="radio" name="leaveStatus" value="ลาแน่นอน" class="peer sr-only" checked>
              <div class="text-center py-2 px-3 rounded-xl border border-slate-200 text-sm font-medium peer-checked:bg-emerald-600 peer-checked:text-white peer-checked:border-emerald-600 transition">
                ✅ ลาแน่นอน (คอนเฟิร์มแล้ว)
              </div>
            </label>
            <label class="cursor-pointer">
              <input type="radio" name="leaveStatus" value="แผนลา" class="peer sr-only">
              <div class="text-center py-2 px-3 rounded-xl border border-slate-200 text-sm font-medium peer-checked:bg-indigo-500 peer-checked:text-white peer-checked:border-indigo-500 transition">
                📌 แผนลา (รอยืนยัน)
              </div>
            </label>
          </div>
        </div>

        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1">เหตุผลที่ลา *</label>
          <input type="text" id="reason" required placeholder="ระบุเหตุผลสั้นๆ เช่น ธุระส่วนตัว, หาหมอ, พักผ่อน"
            class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 focus:ring-2 focus:ring-blue-500 outline-none text-sm">
        </div>

        <button type="submit" id="submitBtn"
          class="w-full bg-slate-900 hover:bg-slate-800 text-white font-medium py-3 rounded-xl shadow-sm transition active:scale-[0.99]">
          บันทึกวันลา
        </button>
      </form>
    </section>

    <!-- ตัวกรองและรายการแสดงผล -->
    <section class="space-y-3">
      <div class="flex flex-wrap items-center justify-between gap-2">
        <h2 class="text-base font-semibold text-slate-800">📋 รายการรอยืนยัน / แผนลา</h2>
        <div class="flex flex-wrap gap-2">
          <select id="filterPerson" onchange="renderLeaves()" class="text-sm bg-white border border-slate-300 rounded-xl px-3 py-1.5 outline-none">
            <option value="ALL">ทุกคนทุกชื่อ</option>
            <option value="กุสุมา ไชยโชติ (พัท)">พัท</option>
            <option value="ภัทราภรณ์ หุ่นดี (รุ้ง)">รุ้ง</option>
            <option value="ประไพพร กรุตรนิยม (ปู)">ปู</option>
            <option value="อรนภา ตุ่มอ่อน (ลูกน้ำ)">ลูกน้ำ</option>
            <option value="จิราพร พิมพ์โคตร (จิ)">จิ</option>
            <option value="วิริยา เหล่าเขตกิจ (ใหม่)">ใหม่</option>
            <option value="เฌอลินญ์ ยศธรเตโชพัฒน์ (เฌอ)">เฌอ</option>
            <option value="วรกาญจน์ พรมนอก (โอ๋)">โอ๋</option>
            <option value="เฉลิมพล คงปรีชา (ตั๊ก)">ตั๊ก</option>
          </select>

          <select id="filterType" onchange="renderLeaves()" class="text-sm bg-white border border-slate-300 rounded-xl px-3 py-1.5 outline-none">
            <option value="ALL">ทุกประเภทการลา</option>
            <option value="ลากิจ">ลากิจ</option>
            <option value="ลาพักร้อน">ลาพักร้อน</option>
            <option value="ลาป่วย">ลาป่วย</option>
            <option value="ลาวันเกิด">ลาวันเกิด</option>
          </select>
        </div>
      </div>

      <div id="leaveList" class="space-y-3"></div>
    </section>

  </main>

  <script>
    const FIREBASE_URL = "https://summary-leave-default-rtdb.asia-southeast1.firebasedatabase.app/leaves.json";
    const members = [
      'กุสุมา ไชยโชติ (พัท)',
      'ภัทราภรณ์ หุ่นดี (รุ้ง)',
      'ประไพพร กรุตรนิยม (ปู)',
      'อรนภา ตุ่มอ่อน (ลูกน้ำ)',
      'จิราพร พิมพ์โคตร (จิ)',
      'วิริยา เหล่าเขตกิจ (ใหม่)',
      'เฌอลินญ์ ยศธรเตโชพัฒน์ (เฌอ)',
      'วรกาญจน์ พรมนอก (โอ๋)',
      'เฉลิมพล คงปรีชา (ตั๊ก)'
    ];

    let allLeaves = [];

    function getTodayLocal() {
      const now = new Date();
      const y = now.getFullYear();
      const m = String(now.getMonth() + 1).padStart(2, '0');
      const d = String(now.getDate()).padStart(2, '0');
      return y + '-' + m + '-' + d;
    }

    const todayStr = getTodayLocal();
    document.getElementById('startDate').value = todayStr;
    document.getElementById('endDate').value = todayStr;

    function setTime(sh, sm, eh, em) {
      document.getElementById('startHour').value = sh;
      document.getElementById('startMin').value = sm;
      document.getElementById('endHour').value = eh;
      document.getElementById('endMin').value = em;
      validateTime();
    }

    function getTimeRange() {
      const sh = document.getElementById('startHour').value;
      const sm = document.getElementById('startMin').value;
      const eh = document.getElementById('endHour').value;
      const em = document.getElementById('endMin').value;
      return {
        startTime: sh + ':' + sm,
        endTime: eh + ':' + em
      };
    }

    function getSelectedType() {
      const el = document.querySelector('input[name="leaveType"]:checked');
      return el ? el.value : 'ลากิจ';
    }

    function toggleTimeBox() {
      const box = document.getElementById('businessTimeBox');
      if (getSelectedType() === 'ลากิจ') {
        box.classList.remove('hidden');
        validateTime();
      } else {
        box.classList.add('hidden');
        document.getElementById('timeErrorMsg').classList.add('hidden');
      }
    }

    function validateTime() {
      if (getSelectedType() !== 'ลากิจ') return true;
      const r = getTimeRange();
      const err = document.getElementById('timeErrorMsg');
      if (r.startTime < '09:00' || r.endTime > '18:00') {
        err.textContent = 'ช่วงเวลาลากิจต้องอยู่ระหว่าง 09.00 - 18.00 เท่านั้น';
        err.classList.remove('hidden');
        return false;
      }
      if (r.startTime >= r.endTime) {
        err.textContent = 'เวลาเริ่มต้นต้องน้อยกว่าเวลาสิ้นสุด';
        err.classList.remove('hidden');
        return false;
      }
      err.classList.add('hidden');
      return true;
    }

    document.getElementById('startHour').addEventListener('change', validateTime);
    document.getElementById('startMin').addEventListener('change', validateTime);
    document.getElementById('endHour').addEventListener('change', validateTime);
    document.getElementById('endMin').addEventListener('change', validateTime);
    toggleTimeBox();

    function formatThaiDate(dateStr) {
      if (!dateStr) return "";
      const parts = String(dateStr).split('-');
      if (parts.length !== 3) return String(dateStr);
      const y = Number(parts[0]);
      const m = Number(parts[1]);
      const d = Number(parts[2]);
      if (!y || !m || !d) return String(dateStr);
      const dateObj = new Date(y, m - 1, d);
      const days = ['อาทิตย์', 'จันทร์', 'อังคาร', 'พุธ', 'พฤหัสบดี', 'ศุกร์', 'เสาร์'];
      const months = ['ม.ค.', 'ก.พ.', 'มี.ค.', 'เม.ย.', 'พ.ค.', 'มิ.ย.', 'ก.ค.', 'ส.ค.', 'ก.ย.', 'ต.ค.', 'พ.ย.', 'ธ.ค.'];
      return 'วัน' + days[dateObj.getDay()] + 'ที่ ' + d + ' ' + months[m - 1] + ' พ.ศ. ' + (y + 543);
    }

    function countDays(start, end) {
      if (!start || !end) return 1;
      const d1 = new Date(start);
      const d2 = new Date(end);
      if (isNaN(d1.getTime()) || isNaN(d2.getTime())) return 1;
      const diffTime = Math.abs(d2 - d1);
      const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24)) + 1;
      return isNaN(diffDays) || diffDays < 1 ? 1 : diffDays;
    }

    function getBadgeStyle(type) {
      if (type === 'ลากิจ') return 'bg-amber-100 text-amber-800 border-amber-200';
      if (type === 'ลาพักร้อน') return 'bg-sky-100 text-sky-800 border-sky-200';
      if (type === 'ลาป่วย') return 'bg-rose-100 text-rose-800 border-rose-200';
      if (type === 'ลาวันเกิด') return 'bg-purple-100 text-purple-800 border-purple-200';
      return 'bg-slate-100 text-slate-800';
    }

    function renderQuotaSummary() {
      const quotas = { 'ลากิจ': 6, 'ลาพักร้อน': 6, 'ลาป่วย': 30, 'ลาวันเกิด': 1 };
      const usage = { 'ลากิจ': {}, 'ลาพักร้อน': {}, 'ลาป่วย': {}, 'ลาวันเกิด': {} };

      Object.keys(quotas).forEach(type => {
        members.forEach(m => { usage[type][m] = 0; });
      });

      allLeaves.forEach(item => {
        if (item && item.status === 'ลาแน่นอน' && usage[item.type] && usage[item.type][item.name] !== undefined) {
          usage[item.type][item.name] += countDays(item.startDate, item.endDate);
        }
      });

      const buildBadge = (icon, label, used, max, bgClass, textClass, barClass) => {
        const percent = Math.min(Math.round((used / max) * 100), 100);
        return (
          '<div class="' + bgClass + ' px-2.5 py-1.5 rounded-lg border border-black/5 flex flex-col justify-between">' +
            '<div class="flex items-center justify-between gap-1 text-[11px] font-medium ' + textClass + '">' +
              '<span>' + icon + ' ' + label + '</span>' +
              '<span class="font-bold">' + used + '/' + max + '</span>' +
            '</div>' +
            '<div class="w-full bg-white/80 h-1 rounded-full overflow-hidden mt-1">' +
              '<div class="' + barClass + ' h-full rounded-full" style="width: ' + percent + '%"></div>' +
            '</div>' +
          '</div>'
        );
      };

      document.getElementById('quotaMatrix').innerHTML = members.map((name, idx) => {
        const rowBg = idx % 2 === 0 ? 'bg-white' : 'bg-slate-50/50';
        return (
          '<div class="' + rowBg + ' p-3 flex flex-col md:flex-row md:items-center justify-between gap-2.5">' +
            '<div class="font-semibold text-sm text-slate-800 md:w-56 shrink-0">' + name + '</div>' +
            '<div class="grid grid-cols-2 sm:grid-cols-4 gap-2 flex-1">' +
              buildBadge('💼', 'ลากิจ', usage['ลากิจ'][name], 6, 'bg-amber-50', 'text-amber-900', 'bg-amber-500') +
              buildBadge('🏖️', 'พักร้อน', usage['ลาพักร้อน'][name], 6, 'bg-sky-50', 'text-sky-900', 'bg-sky-500') +
              buildBadge('🤒', 'ลาป่วย', usage['ลาป่วย'][name], 30, 'bg-rose-50', 'text-rose-900', 'bg-rose-500') +
              buildBadge('🎂', 'วันเกิด', usage['ลาวันเกิด'][name], 1, 'bg-purple-50', 'text-purple-900', 'bg-purple-500') +
            '</div>' +
          '</div>'
        );
      }).join('');
    }

    function formatItemSchedule(item) {
      const datePart = item.startDate === item.endDate
        ? formatThaiDate(item.startDate)
        : 'ตั้งแต่ ' + formatThaiDate(item.startDate) + ' ถึง ' + formatThaiDate(item.endDate) + ' (' + countDays(item.startDate, item.endDate) + ' วัน)';

      if (item.type === 'ลากิจ' && item.startTime && item.endTime) {
        return '🗓️ ' + datePart + ' ⏰ เวลา ' + String(item.startTime).replace(':', '.') + '-' + String(item.endTime).replace(':', '.');
      }
      return '🗓️ ' + datePart;
    }

    function renderLeaves() {
      const personFilter = document.getElementById('filterPerson').value;
      const typeFilter = document.getElementById('filterType').value;
      const listEl = document.getElementById('leaveList');

      let filtered = allLeaves.filter(item => item && !item.isLocked);
      if (personFilter !== 'ALL') filtered = filtered.filter(item => item.name === personFilter);
      if (typeFilter !== 'ALL') filtered = filtered.filter(item => item.type === typeFilter);

      if (filtered.length === 0) {
        listEl.innerHTML = '<div class="bg-white rounded-2xl p-8 text-center text-sm text-slate-400 border border-slate-200">ไม่มีรายการรอยืนยันในขณะนี้ (รายการที่ยืนยันแล้วถูกซ่อนไว้)</div>';
        return;
      }

      listEl.innerHTML = filtered.map(item => {
        const statusBadge = item.status === 'ลาแน่นอน'
          ? '<span class="text-xs font-medium px-2.5 py-0.5 rounded-full bg-emerald-100 text-emerald-800 border border-emerald-200">✅ ลาแน่นอน</span>'
          : '<span class="text-xs font-medium px-2.5 py-0.5 rounded-full bg-indigo-100 text-indigo-800 border border-indigo-200">📌 แผนลา</span>';

        return (
          '<div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-200 flex justify-between items-start gap-3">' +
            '<div class="space-y-1.5">' +
              '<div class="flex flex-wrap items-center gap-2">' +
                '<span class="font-bold text-slate-900 text-base">' + (item.name || '') + '</span>' +
                '<span class="text-xs font-medium px-2.5 py-0.5 rounded-full border ' + getBadgeStyle(item.type) + '">' + (item.type || '') + '</span>' +
                statusBadge +
              '</div>' +
              '<p class="text-sm font-medium text-blue-700">' + formatItemSchedule(item) + '</p>' +
              '<p class="text-sm text-slate-600">💬 เหตุผล: ' + (item.reason || '') + '</p>' +
            '</div>' +
            '<div class="flex items-center gap-1">' +
              '<button type="button" onclick="confirmAndLock(\'' + item.id + '\')" class="text-emerald-600 hover:text-emerald-800 p-1.5 rounded-lg hover:bg-emerald-50 text-xs font-medium">✔️ ยืนยัน</button>' +
              '<button type="button" onclick="editLeave(\'' + item.id + '\')" class="text-blue-500 hover:text-blue-700 p-1.5 rounded-lg hover:bg-blue-50 text-xs font-medium">แก้ไข</button>' +
              '<button type="button" onclick="deleteLeave(\'' + item.id + '\')" class="text-slate-400 hover:text-rose-600 p-1.5 rounded-lg hover:bg-rose-50 text-xs">ลบ</button>' +
            '</div>' +
          '</div>'
        );
      }).join('');
    }

    // แสดงตารางโควตาและรายการเริ่มต้นทันที
    renderQuotaSummary();
    renderLeaves();

    async function fetchLeaves() {
      const statusEl = document.getElementById('syncStatus');
      try {
        const res = await fetch(FIREBASE_URL);
        const data = await res.json();
        allLeaves = (data && typeof data === 'object')
          ? Object.entries(data).map(([id, val]) => Object.assign({ id: id, isLocked: false }, val || {}))
          : [];
        allLeaves.sort((a, b) => String(b.startDate || '').localeCompare(String(a.startDate || '')));
        statusEl.textContent = 'บันทึกและดูรายการลาของทุกคนแบบเรียลไทม์';
      } catch (err) {
        statusEl.textContent = 'กำลังแสดงข้อมูลออฟไลน์ / เชื่อมต่อฐานข้อมูลไม่ได้';
      }
      renderQuotaSummary();
      renderLeaves();
    }

    async function confirmAndLock(id) {
      if (!confirm('ยืนยันรายการนี้ใช่ไหม? เมื่อยืนยันแล้ว รายการจะถูกซ่อนจากหน้าจอหลัก (แต่ยังเก็บไว้ในระบบสำหรับ export รายงาน)')) return;
      const updateUrl = FIREBASE_URL.replace('/leaves.json', '/leaves/' + id + '/isLocked.json');
      await fetch(updateUrl, { method: 'PUT', body: JSON.stringify(true) });
      if (document.getElementById('editId').value === id) resetForm();
      fetchLeaves();
    }

    function editLeave(id) {
      const item = allLeaves.find(i => i.id === id);
      if (!item || item.isLocked) return;

      document.getElementById('editId').value = item.id;
      document.getElementById('empName').value = item.name || '';
      document.getElementById('startDate').value = item.startDate || todayStr;
      document.getElementById('endDate').value = item.endDate || todayStr;
      document.getElementById('reason').value = item.reason || '';

      document.querySelectorAll('input[name="leaveType"]').forEach(r => {
        if (r.value === item.type) r.checked = true;
      });
      toggleTimeBox();

      if (item.startTime && item.endTime) {
        const sp = String(item.startTime).split(':');
        const ep = String(item.endTime).split(':');
        setTime(sp[0] || '09', sp[1] === '30' ? '30' : '00', ep[0] || '18', ep[1] === '30' ? '30' : '00');
      } else {
        setTime('09', '00', '18', '00');
      }

      document.querySelectorAll('input[name="leaveStatus"]').forEach(r => {
        if (r.value === item.status) r.checked = true;
      });

      document.getElementById('formTitle').textContent = '✏️ แก้ไขรายการวันลา';
      document.getElementById('submitBtn').textContent = 'บันทึกการแก้ไข';
      document.getElementById('cancelEditBtn').classList.remove('hidden');
      window.scrollTo({ top: 200, behavior: 'smooth' });
    }

    function resetForm() {
      document.getElementById('editId').value = '';
      document.getElementById('leaveForm').reset();
      document.getElementById('startDate').value = todayStr;
      document.getElementById('endDate').value = todayStr;
      setTime('09', '00', '18', '00');
      toggleTimeBox();
      document.getElementById('formTitle').textContent = '➕ แจ้งวันลาใหม่';
      document.getElementById('submitBtn').textContent = 'บันทึกวันลา';
      document.getElementById('cancelEditBtn').classList.add('hidden');
    }

    document.getElementById('leaveForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      if (!validateTime()) return;

      const editId = document.getElementById('editId').value;
      const btn = document.getElementById('submitBtn');
      const leaveType = getSelectedType();
      const timeRange = getTimeRange();
      btn.disabled = true;
      btn.textContent = editId ? 'กำลังอัปเดต...' : 'กำลังบันทึก...';

      const payload = {
        name: document.getElementById('empName').value,
        startDate: document.getElementById('startDate').value,
        endDate: document.getElementById('endDate').value,
        type: leaveType,
        startTime: leaveType === 'ลากิจ' ? timeRange.startTime : null,
        endTime: leaveType === 'ลากิจ' ? timeRange.endTime : null,
        status: document.querySelector('input[name="leaveStatus"]:checked').value,
        reason: document.getElementById('reason').value.trim(),
        isLocked: false,
        createdAt: new Date().toISOString()
      };

      if (editId) {
        const updateUrl = FIREBASE_URL.replace('/leaves.json', '/leaves/' + editId + '.json');
        await fetch(updateUrl, { method: 'PUT', body: JSON.stringify(payload) });
      } else {
        await fetch(FIREBASE_URL, { method: 'POST', body: JSON.stringify(payload) });
      }

      resetForm();
      btn.disabled = false;
      fetchLeaves();
    });

    async function deleteLeave(id) {
      const item = allLeaves.find(i => i.id === id);
      if (!item || item.isLocked) return;
      if (!confirm('ต้องการลบ/ยกเลิกรายการลานี้ใช่ไหม? (หากลบ ระบบจะคืนโควตาให้ทันที)')) return;
      const deleteUrl = FIREBASE_URL.replace('/leaves.json', '/leaves/' + id + '.json');
      await fetch(deleteUrl, { method: 'DELETE' });
      if (document.getElementById('editId').value === id) resetForm();
      fetchLeaves();
    }

    function copySummary() {
      const visibleLeaves = allLeaves.filter(item => item && !item.isLocked);
      if (visibleLeaves.length === 0) return alert('ไม่มีรายการรอยืนยันสำหรับคัดลอก');
      const lines = visibleLeaves.slice(0, 15).map((item, idx) => {
        const timeText = (item.type === 'ลากิจ' && item.startTime && item.endTime)
          ? ' (' + String(item.startTime).replace(':', '.') + '-' + String(item.endTime).replace(':', '.') + ')'
          : '';
        const dText = item.startDate === item.endDate
          ? formatThaiDate(item.startDate)
          : formatThaiDate(item.startDate) + ' ถึง ' + formatThaiDate(item.endDate);
        return (idx + 1) + '. ' + item.name + ' (' + item.type + timeText + ' - ' + item.status + ')\n   📅 ' + dText + '\n   💬 เหตุผล: ' + item.reason;
      });
      const text = '📌 อัปเดตรายการวันลาทีม (รอยืนยัน)\n------------------\n' + lines.join('\n\n');
      navigator.clipboard.writeText(text).then(() => {
        alert('คัดลอกสรุปรายการเรียบร้อย!');
      });
    }

    function exportToExcel() {
      if (allLeaves.length === 0) return alert('ยังไม่มีข้อมูลสำหรับดาวน์โหลด');
      let csv = '\uFEFFลำดับ,ชื่อ-นามสกุล,ประเภทการลา,ช่วงเวลา,สถานะ,การยืนยัน,ตั้งแต่วันที่,ถึงวันที่,จำนวนวัน,เหตุผล\n';
      allLeaves.forEach((item, index) => {
        const daysCount = countDays(item.startDate, item.endDate);
        const lockStatus = item.isLocked ? 'ยืนยันแล้ว (ล็อก)' : 'รอยืนยัน / แผนลา';
        const timeRange = (item.type === 'ลากิจ' && item.startTime && item.endTime)
          ? String(item.startTime).replace(':', '.') + '-' + String(item.endTime).replace(':', '.')
          : '-';
        csv += (index + 1) + ',"' + (item.name || '') + '","' + (item.type || '') + '","' + timeRange + '","' + (item.status || '') + '","' + lockStatus + '","' + (item.startDate || '') + '","' + (item.endDate || '') + '",' + daysCount + ',"' + (item.reason || '') + '"\n';
      });
      const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'รายงานวันลาทีมทั้งหมด_' + getTodayLocal() + '.csv';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
    }

    fetchLeaves();
  </script>
</body>
</html>
