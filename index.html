<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ระบบบันทึกและอัปเดตวันลาทีม</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Prompt', sans-serif; background-color: #f8fafc; }
  </style>
</head>
<body class="text-slate-800 pb-12">

  <!-- Header -->
  <header class="bg-white border-b border-slate-200 sticky top-0 z-10 shadow-sm">
    <div class="max-w-4xl mx-auto px-4 py-4 flex justify-between items-center">
      <div>
        <h1 class="text-xl font-bold text-slate-900">📅 อัปเดตวันลาทีม</h1>
        <p class="text-xs text-slate-500">บันทึกและดูรายการลาของทุกคนแบบเรียลไทม์</p>
      </div>
      <button onclick="copySummary()" class="bg-emerald-600 hover:bg-emerald-700 text-white text-sm font-medium px-3.5 py-2 rounded-xl shadow-sm transition active:scale-95">
        📋 คัดลอกส่งแชท
      </button>
    </div>
  </header>

  <main class="max-w-4xl mx-auto px-4 mt-6 space-y-6">

    <!-- สรุปโควตาการลาแยกตามประเภท -->
    <section class="bg-white p-5 rounded-2xl shadow-sm border border-slate-200 space-y-4">
      <h2 class="text-base font-semibold text-slate-800">📊 สรุปโควตาวันลาคงเหลือของทีม</h2>
      
      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <!-- ลากิจ -->
        <div class="bg-amber-50/50 p-4 rounded-xl border border-amber-200 space-y-3">
          <h3 class="font-bold text-amber-900 text-sm flex items-center gap-1.5">💼 โควตา "ลากิจ" (สูงสุด 6 วัน)</h3>
          <div id="quotaBusiness" class="space-y-2"></div>
        </div>

        <!-- ลาพักร้อน -->
        <div class="bg-sky-50/50 p-4 rounded-xl border border-sky-200 space-y-3">
          <h3 class="font-bold text-sky-900 text-sm flex items-center gap-1.5">🏖️ โควตา "ลาพักร้อน" (สูงสุด 6 วัน)</h3>
          <div id="quotaVacation" class="space-y-2"></div>
        </div>

        <!-- ลาป่วย -->
        <div class="bg-rose-50/50 p-4 rounded-xl border border-rose-200 space-y-3">
          <h3 class="font-bold text-rose-900 text-sm flex items-center gap-1.5">🤒 โควตา "ลาป่วย" (สูงสุด 30 วัน)</h3>
          <div id="quotaSick" class="space-y-2"></div>
        </div>

        <!-- ลาวันเกิด -->
        <div class="bg-purple-50/50 p-4 rounded-xl border border-purple-200 space-y-3">
          <h3 class="font-bold text-purple-900 text-sm flex items-center gap-1.5">🎂 โควตา "ลาวันเกิด" (สูงสุด 1 วัน)</h3>
          <div id="quotaBirthday" class="space-y-2"></div>
        </div>
      </div>
    </section>

    <!-- ฟอร์มบันทึกวันลา -->
    <section class="bg-white p-5 rounded-2xl shadow-sm border border-slate-200">
      <h2 class="text-base font-semibold mb-4 text-slate-800">➕ แจ้งวันลาใหม่</h2>
      <form id="leaveForm" class="space-y-4">
        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1">ชื่อ-ชื่อเล่น ผู้ลา *</label>
          <select id="empName" required
            class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none text-sm bg-white">
            <option value="" disabled selected>-- กรุณาเลือกชื่อ --</option>
            <option value="กุสุมา ไชยโชติ (พัท)">กุสุมา ไชยโชติ (พัท)</option>
            <option value="ภัทราภรณ์ หุ่นดี (รุ้ง)">ภัทราภรณ์ หุ่นดี (รุ้ง)</option>
            <option value="ประไพพร กรุตรนิยม (ปู)">ประไพพร กรุตรนิยม (ปู)</option>
            <option value="อรนภา ตุ่มอ่อน (ลูกน้ำ)">อรนภา ตุ่มอ่อน (ลูกน้ำ)</option>
            <option value="จิราพร พิมพ์โคตร (จิ)">จิราพร พิมพ์โคตร (จิ)</option>
            <option value="วิริยา เหล่าเขตกิจ (ใหม่)">วิริยา เหล่าเขตกิจ (ใหม่)</option>
            <option value="เฌอลินญ์ ยศธรเตโชพัฒน์ (เฌอ)">เฌอลินญ์ ยศธรเตโชพัฒน์ (เฌอ)</option>
            <option value="วรกาญจน์ พรมนอก (โอ๋)">วรกาญจน์ พรมนอก (โอ๋)</option>
            <option value="เฉลิมพล คงปรีชา (ตั๊ก)">เฉลิมพล คงปรีชา (ตั๊ก)</option>
          </select>
        </div>

        <!-- เลือกช่วงวันที่ลา (ลาหลายวัน) -->
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <div>
            <label class="block text-sm font-medium text-slate-700 mb-1">ตั้งแต่วันที่ *</label>
            <input type="date" id="startDate" required
              class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none text-sm">
          </div>
          <div>
            <label class="block text-sm font-medium text-slate-700 mb-1">ถึงวันที่ (กรณีลาวันเดียว ให้เลือกวันเดิม) *</label>
            <input type="date" id="endDate" required
              class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none text-sm">
          </div>
        </div>

        <!-- ประเภทการลา -->
        <div>
          <label class="block text-sm font-medium text-slate-700 mb-2">ประเภทการลา *</label>
          <div class="grid grid-cols-2 sm:grid-cols-4 gap-2.5">
            <label class="cursor-pointer">
              <input type="radio" name="leaveType" value="ลากิจ" class="peer sr-only" checked>
              <div class="text-center py-2.5 px-3 rounded-xl border border-slate-200 text-sm font-medium peer-checked:bg-amber-500 peer-checked:text-white peer-checked:border-amber-500 transition">
                💼 ลากิจ
              </div>
            </label>
            <label class="cursor-pointer">
              <input type="radio" name="leaveType" value="ลาพักร้อน" class="peer sr-only">
              <div class="text-center py-2.5 px-3 rounded-xl border border-slate-200 text-sm font-medium peer-checked:bg-sky-500 peer-checked:text-white peer-checked:border-sky-500 transition">
                🏖️ ลาพักร้อน
              </div>
            </label>
            <label class="cursor-pointer">
              <input type="radio" name="leaveType" value="ลาป่วย" class="peer sr-only">
              <div class="text-center py-2.5 px-3 rounded-xl border border-slate-200 text-sm font-medium peer-checked:bg-rose-500 peer-checked:text-white peer-checked:border-rose-500 transition">
                🤒 ลาป่วย
              </div>
            </label>
            <label class="cursor-pointer">
              <input type="radio" name="leaveType" value="ลาวันเกิด" class="peer sr-only">
              <div class="text-center py-2.5 px-3 rounded-xl border border-slate-200 text-sm font-medium peer-checked:bg-purple-500 peer-checked:text-white peer-checked:border-purple-500 transition">
                🎂 ลาวันเกิด
              </div>
            </label>
          </div>
        </div>

        <!-- สถานะการลา -->
        <div>
          <label class="block text-sm font-medium text-slate-700 mb-2">สถานะการลา *</label>
          <div class="grid grid-cols-2 gap-2.5">
            <label class="cursor-pointer">
              <input type="radio" name="leaveStatus" value="ลาแน่นอน" class="peer sr-only" checked>
              <div class="text-center py-2 px-3 rounded-xl border border-slate-200 text-sm font-medium peer-checked:bg-emerald-600 peer-checked:text-white peer-checked:border-emerald-600 transition">
                ✅ ลาแน่นอน (คอนเฟิร์มแล้ว)
              </div>
            </label>
            <label class="cursor-pointer">
              <input type="radio" name="leaveStatus" value="แผนลา" class="peer sr-only">
              <div class="text-center py-2 px-3 rounded-xl border border-slate-200 text-sm font-medium peer-checked:bg-indigo-500 peer-checked:text-white peer-checked:border-indigo-500 transition">
                📌 แผนลา (รอยืนยัน)
              </div>
            </label>
          </div>
        </div>

        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1">เหตุผลที่ลา *</label>
          <input type="text" id="reason" required placeholder="ระบุเหตุผลสั้นๆ เช่น ธุระส่วนตัว, หาหมอ, พักผ่อน"
            class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none text-sm">
        </div>

        <button type="submit" id="submitBtn"
          class="w-full bg-slate-900 hover:bg-slate-800 text-white font-medium py-3 rounded-xl shadow-sm transition active:scale-[0.99]">
          บันทึกวันลา
        </button>
      </form>
    </section>

    <!-- ตัวกรองและรายการแสดงผล -->
    <section class="space-y-3">
      <div class="flex flex-wrap items-center justify-between gap-2">
        <h2 class="text-base font-semibold text-slate-800">📋 รายการอัปเดตของทุกคน</h2>
        <select id="filterType" onchange="renderLeaves()" class="text-sm bg-white border border-slate-300 rounded-xl px-3 py-1.5 outline-none">
          <option value="ALL">แสดงทุกประเภทการลา</option>
          <option value="ลากิจ">ลากิจ</option>
          <option value="ลาพักร้อน">ลาพักร้อน</option>
          <option value="ลาป่วย">ลาป่วย</option>
          <option value="ลาวันเกิด">ลาวันเกิด</option>
        </select>
      </div>

      <div id="leaveList" class="space-y-3">
        <p class="text-center text-sm text-slate-400 py-8">กำลังโหลดข้อมูล...</p>
      </div>
    </section>

  </main>

  <script>
    const FIREBASE_URL = "https://summary-leave-default-rtdb.asia-southeast1.firebasedatabase.app/leaves.json";

    let allLeaves = [];

    function formatThaiDate(dateStr) {
      if (!dateStr) return "";
      const [y, m, d] = dateStr.split('-').map(Number);
      const dateObj = new Date(y, m - 1, d);
      const days = ['อาทิตย์', 'จันทร์', 'อังคาร', 'พุธ', 'พฤหัสบดี', 'ศุกร์', 'เสาร์'];
      const months = [
        'มกราคม', 'กุมภาพันธ์', 'มีนาคม', 'เมษายน', 'พฤษภาคม', 'มิถุนายน',
        'กรกฎาคม', 'สิงหาคม', 'กันยายน', 'ตุลาคม', 'พฤศจิกายน', 'ธันวาคม'
      ];
      return `วัน${days[dateObj.getDay()]}ที่ ${d} ${months[m - 1]} พ.ศ. ${y + 543}`;
    }

    function countDays(start, end) {
      const d1 = new Date(start);
      const d2 = new Date(end);
      const diffTime = Math.abs(d2 - d1);
      const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24)) + 1;
      return isNaN(diffDays) || diffDays < 1 ? 1 : diffDays;
    }

    const todayStr = new Date().toISOString().split('T')[0];
    document.getElementById('startDate').value = todayStr;
    document.getElementById('endDate').value = todayStr;

    function getBadgeStyle(type) {
      const styles = {
        'ลากิจ': 'bg-amber-100 text-amber-800 border-amber-200',
        'ลาพักร้อน': 'bg-sky-100 text-sky-800 border-sky-200',
        'ลาป่วย': 'bg-rose-100 text-rose-800 border-rose-200',
        'ลาวันเกิด': 'bg-purple-100 text-purple-800 border-purple-200'
      };
      return styles[type] || 'bg-slate-100 text-slate-800';
    }

    async function fetchLeaves() {
      try {
        const res = await fetch(FIREBASE_URL);
        const data = await res.json();
        allLeaves = data
          ? Object.entries(data).map(([id, val]) => ({ id, ...val }))
          : [];
        allLeaves.sort((a, b) => b.startDate.localeCompare(a.startDate));
        renderQuotaSummary();
        renderLeaves();
      } catch (err) {
        document.getElementById('leaveList').innerHTML =
          `<p class="text-center text-sm text-rose-500 py-6">ไม่สามารถเชื่อมต่อฐานข้อมูลได้</p>`;
      }
    }

    function renderQuotaSummary() {
      const members = [
        'กุสุมา ไชยโชติ (พัท)',
        'ภัทราภรณ์ หุ่นดี (รุ้ง)',
        'ประไพพร กรุตรนิยม (ปู)',
        'อรนภา ตุ่มอ่อน (ลูกน้ำ)',
        'จิราพร พิมพ์โคตร (จิ)',
        'วิริยา เหล่าเขตกิจ (ใหม่)',
        'เฌอลินญ์ ยศธรเตโชพัฒน์ (เฌอ)',
        'วรกาญจน์ พรมนอก (โอ๋)',
        'เฉลิมพล คงปรีชา (ตั๊ก)'
      ];

      const quotas = {
        'ลากิจ': 6,
        'ลาพักร้อน': 6,
        'ลาป่วย': 30,
        'ลาวันเกิด': 1
      };

      const usage = {
        'ลากิจ': {},
        'ลาพักร้อน': {},
        'ลาป่วย': {},
        'ลาวันเกิด': {}
      };

      Object.keys(quotas.type || quotas).forEach(type => {
        members.forEach(m => usage[type][m] = 0);
      });

      allLeaves.forEach(item => {
        if (item.status === 'ลาแน่นอน' && usage[item.type] && usage[item.type][item.name] !== undefined) {
          usage[item.type][item.name] += countDays(item.startDate, item.endDate);
        }
      });

      const generateList = (type, maxQuota, colorClass) => {
        return members.map(name => {
          const used = usage[type][name];
          const percent = Math.min(Math.round((used / maxQuota) * 100), 100);
          return `
            <div class="bg-white p-2.5 rounded-lg border border-slate-100 space-y-1">
              <div class="flex justify-between items-center text-xs font-semibold">
                <span class="text-slate-800">${name}</span>
                <span class="text-slate-600">${used}/${maxQuota} วัน</span>
              </div>
              <div class="w-full bg-slate-100 h-1.5 rounded-full overflow-hidden">
                <div class="${colorClass} h-full rounded-full transition-all duration-500" style="width: ${percent}%"></div>
              </div>
            </div>
          `;
        }).join('');
      };

      document.getElementById('quotaBusiness').innerHTML = generateList('ลากิจ', 6, 'bg-amber-500');
      document.getElementById('quotaVacation').innerHTML = generateList('ลาพักร้อน', 6, 'bg-sky-500');
      document.getElementById('quotaSick').innerHTML = generateList('ลาป่วย', 30, 'bg-rose-500');
      document.getElementById('quotaBirthday').innerHTML = generateList('ลาวันเกิด', 1, 'bg-purple-500');
    }

    function renderLeaves() {
      const filter = document.getElementById('filterType').value;
      const listEl = document.getElementById('leaveList');
      const filtered = filter === 'ALL' ? allLeaves : allLeaves.filter(item => item.type === filter);

      if (filtered.length === 0) {
        listEl.innerHTML = `<div class="bg-white rounded-2xl p-8 text-center text-sm text-slate-400 border border-slate-200">ยังไม่มีรายการวันลาในหมวดนี้</div>`;
        return;
      }

      listEl.innerHTML = filtered.map(item => {
        const dateText = item.startDate === item.endDate 
          ? `🗓️ ${formatThaiDate(item.startDate)}`
          : `🗓️ ตั้งแต่ ${formatThaiDate(item.startDate)} ถึง ${formatThaiDate(item.endDate)} (${countDays(item.startDate, item.endDate)} วัน)`;
        
        const statusBadge = item.status === 'ลาแน่นอน' 
          ? `<span class="text-xs font-medium px-2.5 py-0.5 rounded-full bg-emerald-100 text-emerald-800 border border-emerald-200">✅ ลาแน่นอน</span>`
          : `<span class="text-xs font-medium px-2.5 py-0.5 rounded-full bg-indigo-100 text-indigo-800 border border-indigo-200">📌 แผนลา</span>`;

        return `
          <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-200 flex justify-between items-start gap-3">
            <div class="space-y-1.5">
              <div class="flex flex-wrap items-center gap-2">
                <span class="font-bold text-slate-900 text-base">${item.name}</span>
                <span class="text-xs font-medium px-2.5 py-0.5 rounded-full border ${getBadgeStyle(item.type)}">
                  ${item.type}
                </span>
                ${statusBadge}
              </div>
              <p class="text-sm font-medium text-blue-700">${dateText}</p>
              <p class="text-sm text-slate-600">💬 เหตุผล: ${item.reason}</p>
            </div>
            <button onclick="deleteLeave('${item.id}')" title="ลบรายการ"
              class="text-slate-400 hover:text-rose-600 p-1.5 rounded-lg hover:bg-rose-50 transition text-xs">
              ลบ
            </button>
          </div>
        `;
      }).join('');
    }

    document.getElementById('leaveForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('submitBtn');
      btn.disabled = true;
      btn.textContent = 'กำลังบันทึก...';

      const payload = {
        name: document.getElementById('empName').value,
        startDate: document.getElementById('startDate').value,
        endDate: document.getElementById('endDate').value,
        type: document.querySelector('input[name="leaveType"]:checked').value,
        status: document.querySelector('input[name="leaveStatus"]:checked').value,
        reason: document.getElementById('reason').value.trim(),
        createdAt: new Date().toISOString()
      };

      await fetch(FIREBASE_URL, {
        method: 'POST',
        body: JSON.stringify(payload)
      });

      document.getElementById('reason').value = '';
      btn.disabled = false;
      btn.textContent = 'บันทึกวันลา';
      fetchLeaves();
    });

    async function deleteLeave(id) {
      if (!confirm('ต้องการลบ/ยกเลิกรายการลานี้ใช่ไหม? (หากเปลี่ยนใจมาทำงาน ระบบจะคืนโควตาให้ทันที)')) return;
      const deleteUrl = FIREBASE_URL.replace('/leaves.json', `/leaves/${id}.json`);
      await fetch(deleteUrl, { method: 'DELETE' });
      fetchLeaves();
    }

    function copySummary() {
      if (allLeaves.length === 0) return alert('ยังไม่มีข้อมูลสำหรับคัดลอก');
      const lines = allLeaves.slice(0, 15).map((item, idx) => {
        const dText = item.startDate === item.endDate ? formatThaiDate(item.startDate) : `${formatThaiDate(item.startDate)} ถึง ${formatThaiDate(item.endDate)}`;
        return `${idx + 1}. ${item.name} (${item.type} - ${item.status})\n   📅 ${dText}\n   💬 เหตุผล: ${item.reason}`;
      });
      const text = `📌 อัปเดตรายการวันลาทีม\n------------------\n${lines.join('\n\n')}`;
      navigator.clipboard.writeText(text).then(() => {
        alert('คัดลอกสรุปรายการวันลาเรียบร้อย! นำไปวางในแชทกลุ่มได้เลย');
      });
    }

    fetchLeaves();
  </script>
</body>
</html>
